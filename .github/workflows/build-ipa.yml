name: Build unsigned IPA
on:
  push:
    branches: ['**']        # build every branch, including ones Claude Code pushes
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macos-26 = Xcode 26 SDK, needed for real Liquid Glass (falls back to frosted material on older SDKs)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project ClipForge.xcodeproj \
            -scheme ClipForge \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" build.log | head -60 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ClipForge.app Payload/
          zip -qry ClipForge-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-unsigned-ipa
          path: ClipForge-unsigned.ipa
