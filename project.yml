name: ClipForge
options:
  bundleIdPrefix: com.arshad
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClipForge:
    type: application
    platform: iOS
    sources: [ClipForge]
    info:
      path: ClipForge/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: ClipForge
        NSPhotoLibraryAddUsageDescription: Save exported clips to your Photos
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        # Change this to match the App ID / provisioning profile you sign with
        PRODUCT_BUNDLE_IDENTIFIER: com.arshad.clipforge
