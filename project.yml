name: ClipForge
options:
  bundleIdPrefix: com.arshad
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "2"
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.1
targets:
  ClipForge:
    type: application
    platform: iOS
    sources: [ClipForge]
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: ClipForge/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: ClipForge
        NSPhotoLibraryAddUsageDescription: Save exported clips to your Photos
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        # Change this to match the App ID / provisioning profile you sign with
        PRODUCT_BUNDLE_IDENTIFIER: com.arshad.clipforge
