name: ClipForge
options:
  bundleIdPrefix: com.arshad
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.5"
    CURRENT_PROJECT_VERSION: "5"
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.1
targets:
  ClipForge:
    type: application
    platform: iOS
    sources: [ClipForge]
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    info:
      path: ClipForge/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: ClipForge
        NSPhotoLibraryAddUsageDescription: Save exported clips to your Photos
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # caption fonts from PeakCut (SIL Open Font License, see ClipForge/Fonts/OFL-*.txt)
        UIAppFonts: [Poppins-ExtraBold.ttf, Anton-Regular.ttf]
        # stream links are downloaded by the ClipForge helper running on your own computer (plain http on your Wi-Fi)
        NSLocalNetworkUsageDescription: Downloads stream links through the ClipForge helper on your computer
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        # Change this to match the App ID / provisioning profile you sign with
        PRODUCT_BUNDLE_IDENTIFIER: com.arshad.clipforge
